[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chiron"
version = "0.1.0"
description = "Autonomous CI/CD Code Review & Remediation Agent — a GitHub App powered by Google Gemini"
authors = [{ name = "Edwin Gigi" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "githubkit[auth-app]>=0.12",
    "PyJWT>=2.9",
    "cryptography>=44",
    "google-genai>=1.0",
    "httpx>=0.28",
    "arq>=0.26",
    "redis[hiredis]>=5.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "opentelemetry-api>=1.29",
    "sentry-sdk[fastapi]>=2.19",
    "pyyaml>=6.0",
    "unidiff>=0.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "respx>=0.22"
]

[project.scripts]
chiron = "chiron.main:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ASYNC"]
ignore = []

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
