version: "3.8"
services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./src:/app/src
    command: uvicorn chiron.main:app --host 0.0.0.0 --port 8080 --reload

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
